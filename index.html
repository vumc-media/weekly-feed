
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>This Week at VUMC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  background:#101827;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;
}
.wrap{
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:14px;
  gap:12px;
  max-width:1100px;
  margin:auto;
}
.header{
  flex:none;
  background:linear-gradient(180deg,#7a0000,#4d0000);
  border-radius:12px;
  padding:16px 12px;
  text-align:center;
  font-size:clamp(22px,3vw,36px);
  font-weight:900;
  text-transform:uppercase;
  line-height:1.15;
}
#status{
  padding:20px;
  text-align:center;
  color:#cbd5e1;
}
#feed{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:18px;
}
.dayblock{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:18px;
  padding:20px 24px;
  opacity:0;
  visibility:hidden;
  transition:opacity .8s ease,visibility 0s linear .8s;
  box-shadow:inset 0 1px 0 #ffffff44;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.dayblock.active{
  opacity:1;
  visibility:visible;
  transition:opacity .8s ease,visibility 0s;
}
.card-content{
  width:100%;
  max-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,2vh,24px);
}
.daytitle{
  flex:none;
  width:100%;
  font-size:30px;
  font-weight:900;
  line-height:1.15;
  text-shadow:0 2px 5px #0006;
  overflow-wrap:break-word;
}
.rows{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,2vh,24px);
}
.row{
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:30px;
  font-weight:700;
  line-height:1.2;
  text-shadow:0 2px 4px #0005;
}
.event{
  width:100%;
  overflow-wrap:break-word;
}
.time{
  font-size:.85em;
  font-weight:900;
  white-space:normal;
}
.orange{background:linear-gradient(#c76512,#9f3f07)}
.blue{background:linear-gradient(#1b5f9a,#0d3f72)}
.green{background:linear-gradient(#2f7a36,#1f5f29)}
.purple{background:linear-gradient(#5a2a7a,#3f1a5a)}

/* Standalone page */
body:not(.embedded) .wrap{
  height:100vh;
  min-height:500px;
}
body:not(.embedded) #feed{
  min-height:350px;
}

/* Atrium embedded display: sizing is calculated against the actual iframe. */
body.embedded .wrap{
  max-width:none;
  padding:10px 14px 14px;
  gap:10px;
}
body.embedded .header{
  font-size:clamp(17px,2vw,24px);
  padding:11px 8px;
  border-radius:10px;
}
body.embedded .dayblock{padding:16px 22px}
@media(max-height:500px){
  body.embedded .wrap{padding:7px 12px 9px;gap:7px}
  body.embedded .header{padding:8px;font-size:18px}
  body.embedded .dayblock{padding:12px 18px}
}
@media(prefers-reduced-motion:reduce){
  .dayblock,.dayblock.active{transition:none}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="header">This Week at VUMC</header>
  <div id="status" role="status">
    Loading this week's schedule…
  </div>
  <div id="feed" aria-live="off"></div>
</main>

<iframe
  id="staffBridge"
  title="Weekly Feed connection"
  src="https://script.google.com/macros/s/AKfycbzHpOIjWgX-jiOMGwiCBrONrmym-9kMJDOQ4DA15re8d-_MUidnpXbIGCZYTqM_gAJV/exec?bridge=1"
  style="position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none"
  tabindex="-1"
  aria-hidden="true">
</iframe>

<script>
(function(){
'use strict';

if(window.self!==window.top){
  document.body.classList.add('embedded');
}

const colors=['orange','blue','green','purple'];
const status=document.getElementById('status');
const feed=document.getElementById('feed');
const DISPLAY_MS=8000;

let loading=false;
let bridgeWindow=null;
let bridgeOrigin='';
let requestNumber=0;
let rotationTimer=null;
let activeIndex=0;

function safe(value){
  return String(value??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function parse(raw){
  const days=[];
  let current=null;
  const dayPattern=
    /^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)\b/i;
  const timePattern=
    /^(\d{1,2}(?::\d{2})?\s*(?:am|pm|a|p)?(?:\s*[-–]\s*\d{1,2}(?::\d{2})?\s*(?:am|pm|a|p)?)?)\s+(.+)$/i;

  String(raw||'')
    .split(/\r?\n/)
    .map(line=>line.trim())
    .filter(Boolean)
    .forEach(line=>{
      if(dayPattern.test(line)){
        current={
          title:line.replace(/\s+/g,' '),
          events:[]
        };
        days.push(current);
      }else if(current){
        const match=line.match(timePattern);
        current.events.push({
          time:match
            ?match[1].replace(/\s+/g,'')
              .replace(/am/gi,'a')
              .replace(/pm/gi,'p')
            :'',
          event:match?match[2]:line
        });
      }
    });
  return days;
}

function showCard(index){
  const cards=Array.from(
    feed.querySelectorAll('.dayblock')
  );
  if(!cards.length)return;

  activeIndex=
    ((index%cards.length)+cards.length)%cards.length;

  cards.forEach((card,i)=>{
    const active=i===activeIndex;
    card.classList.toggle('active',active);
    card.setAttribute('aria-hidden',String(!active));
  });
}

/* Find the largest readable font size that fits the card in both directions.
   Recalculate on resize, so standalone and embedded layouts both work. */
function fitCard(card){
  const content=card.querySelector('.card-content');
  const title=card.querySelector('.daytitle');
  const rows=card.querySelectorAll('.row');
  if(!content||!title)return;

  const style=getComputedStyle(card);
  const maxWidth=card.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
  const maxHeight=card.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
  if(maxWidth<=0||maxHeight<=0)return;

  function setSize(size){
    title.style.fontSize=Math.round(size*.78)+'px';
    rows.forEach(row=>row.style.fontSize=size+'px');
  }
  function fits(){
    if(content.scrollHeight>maxHeight+1||content.scrollWidth>maxWidth+1)return false;
    const elements=[title,...rows,...content.querySelectorAll('.event,.time')];
    return elements.every(el=>el.scrollWidth<=el.clientWidth+1);
  }

  let low=12,high=64;
  for(let i=0;i<12;i++){
    const mid=(low+high)/2;
    setSize(mid);
    if(fits())low=mid;
    else high=mid;
  }
  setSize(Math.floor(low));
}
function fitAll(){
  feed.querySelectorAll('.dayblock').forEach(fitCard);
}

function render(raw){
  if(rotationTimer)clearInterval(rotationTimer);

  const days=parse(raw);
  if(!days.length){
    feed.innerHTML='';
    status.style.display='block';
    status.textContent=
      'No weekly schedule has been published yet.';
    return;
  }

  feed.innerHTML=days.map((day,index)=>`
    <section class="dayblock ${colors[index%colors.length]}">
      <div class="card-content">
      <div class="daytitle">${safe(day.title)}</div>
      <div class="rows">
        ${day.events.map(event=>`
          <div class="row">
            <span class="event">${safe(event.event)}</span>
            <span class="time">${safe(event.time)}</span>
          </div>
        `).join('')}
      </div>
      </div>
    </section>
  `).join('');

  status.style.display='none';
  showCard(0);
  requestAnimationFrame(()=>requestAnimationFrame(fitAll));

  if(days.length>1){
    rotationTimer=setInterval(
      ()=>showCard(activeIndex+1),
      DISPLAY_MS
    );
  }
}

window.addEventListener('resize',()=>{
  requestAnimationFrame(()=>requestAnimationFrame(fitAll));
});

function validBridgeOrigin(origin){
  try{
    const url=new URL(origin);
    return url.protocol==='https:'&&(
      url.hostname==='script.google.com'||
      url.hostname==='script.googleusercontent.com'||
      url.hostname.endsWith('.googleusercontent.com')
    );
  }catch{
    return false;
  }
}

window.addEventListener('message',event=>{
  if(!validBridgeOrigin(event.origin))return;

  const message=event.data;
  if(!message||typeof message!=='object')return;
  if(message.type!=='vumc-bridge-ready')return;
  if(loading)return;

  loading=true;
  bridgeWindow=event.source;
  bridgeOrigin=event.origin;

  const requestId=
    'public-weekly-'+Date.now()+'-'+(++requestNumber);

  const timeout=setTimeout(()=>{
    status.style.display='block';
    status.textContent=
      'Could not load the weekly schedule. Please refresh.';
  },20000);

  function handleResponse(response){
    if(
      response.source!==bridgeWindow||
      response.origin!==bridgeOrigin||
      !response.data||
      response.data.type!=='vumc-bridge-response'||
      response.data.requestId!==requestId
    )return;

    window.removeEventListener('message',handleResponse);
    clearTimeout(timeout);

    const result=response.data.result;
    if(result&&result.success){
      render(result.schedule);
    }else{
      status.style.display='block';
      status.textContent=
        'Schedule unavailable. Please try again later.';
    }
  }

  window.addEventListener('message',handleResponse);

  bridgeWindow.postMessage({
    type:'vumc-bridge-request',
    requestId,
    action:'getPublicWeeklySchedule',
    payload:{}
  },bridgeOrigin);
});

setTimeout(()=>{
  if(!loading){
    status.textContent=
      'Could not connect to the weekly schedule. Please refresh.';
  }
},15000);

})();
</script>
</body>
</html>
