<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VUMC Weekly Schedule</title>

<style>
:root { --speed: 12; }

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent!important;
  overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

#header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:16px;
  background:linear-gradient(180deg,#7a0000,#4d0000);
  color:#fff;
  text-align:center;
  font-weight:900;
  font-size:clamp(28px,3.2vh,52px);
  text-transform:uppercase;
  letter-spacing:.5px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
}

#scrollArea{
  position:absolute;
  inset:0;
  top:90px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  will-change:transform;
}

.blocks{
  width:100%;
  margin:2vh 0 4vh;
  display:flex;
  flex-direction:column;
  gap:2vh;
}

.dayblock{
  width:100%;
  box-sizing:border-box;
  border-radius:18px;
  color:#fff;
  padding:3vh 52px 3vh 36px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 12px 22px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.30);
}

.dayblock::before{
  content:"";
  position:absolute;
  inset:-45% -25%;
  background:linear-gradient(110deg,
    rgba(255,255,255,.25) 0%,
    rgba(255,255,255,.10) 25%,
    rgba(255,255,255,0) 55%);
  transform:rotate(-6deg);
}

.daytitle{
  font-weight:900;
  font-size:clamp(26px,2.8vh,42px);
  margin-bottom:1.2vh;
  text-shadow:0 3px 6px rgba(0,0,0,.55);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rows{
  display:flex;
  flex-direction:column;
  gap:.9vh;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:18px;
  font-size:clamp(16px,1.95vh,26px);
  font-weight:700;
  text-shadow:0 2px 5px rgba(0,0,0,.45);
  white-space:nowrap;
  overflow:hidden;
}

.event{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  flex:0 0 110px;
  min-width:110px;
  text-align:right;
  font-weight:900;
  letter-spacing:.2px;
}

.orange{background:linear-gradient(180deg,#c76512,#9f3f07);}
.blue{background:linear-gradient(180deg,#1b5f9a,#0d3f72);}
.green{background:linear-gradient(180deg,#2f7a36,#1f5f29);}
.purple{background:linear-gradient(180deg,#5a2a7a,#3f1a5a);}
</style>
</head>

<body>

<div id="header">This Week at VUMC</div>

<div id="scrollArea">
  <div id="content">
    <div id="blocks" class="blocks"></div>
  </div>
  <div id="clone"></div>
</div>

<script>
const colors = ["orange", "blue", "green", "purple"];

async function loadSchedule(){
  try{
    const res = await fetch("schedule.json?v=" + Date.now(), { cache:"no-store" });
    const data = await res.json();

    if(!data.days || !data.days.length){
      document.getElementById("blocks").innerHTML = makeEmpty();
      return;
    }

    renderSchedule(data.days);
    startScroll();
  }catch(err){
    document.getElementById("blocks").innerHTML = makeError();
    startScroll();
  }
}

function renderSchedule(days){
  const blocks = document.getElementById("blocks");

  blocks.innerHTML = days.map((day, index) => {
    const color = colors[index % colors.length];

    const rows = day.events.map(item => `
      <div class="row">
        <span class="event">${escapeHTML(item.event)}</span>
        <span class="time">${escapeHTML(item.time || "")}</span>
      </div>
    `).join("");

    return `
      <div class="dayblock ${color}">
        <div class="daytitle">${escapeHTML(day.title)}</div>
        <div class="rows">${rows}</div>
      </div>
    `;
  }).join("");
}

function makeEmpty(){
  return `
    <div class="dayblock orange">
      <div class="daytitle">No Schedule Posted</div>
      <div class="rows">
        <div class="row"><span class="event">Please check back soon.</span><span class="time"></span></div>
      </div>
    </div>
  `;
}

function makeError(){
  return `
    <div class="dayblock orange">
      <div class="daytitle">Schedule Unavailable</div>
      <div class="rows">
        <div class="row"><span class="event">Please check back soon.</span><span class="time"></span></div>
      </div>
    </div>
  `;
}

function escapeHTML(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function startScroll(){
  const speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 12;
  const scrollArea = document.getElementById("scrollArea");
  const content = document.getElementById("content");
  const clone = document.getElementById("clone");

  clone.innerHTML = content.innerHTML;

  let y = 0;
  let last = performance.now();

  function animate(t){
    const dt = (t-last)/1000;
    last = t;

    y -= speed * dt;

    const h = content.offsetHeight;
    if(-y >= h) y += h;

    scrollArea.style.transform = `translateY(${y}px)`;
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
}

loadSchedule();
</script>

</body>
</html>
