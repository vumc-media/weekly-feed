<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Feed Admin | VUMC</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#101827;color:#fff;padding:30px}.wrap{max-width:1000px;margin:auto}h1{margin-top:0}label{display:block;font-weight:700;margin:18px 0 8px}input,textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px;font-size:16px}textarea{min-height:360px;font-family:inherit;line-height:1.45}button{margin-top:18px;border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:800;cursor:pointer;background:#42e8d5;color:#082222}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:18px;font-weight:700;min-height:24px}.help{color:#cbd5e1;line-height:1.5}.preview-title{margin-top:34px;font-size:24px;font-weight:900}.preview{margin-top:14px;background:#0b1220;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;max-height:520px;overflow:auto}.preview-header{padding:14px;margin-bottom:16px;background:linear-gradient(180deg,#7a0000,#4d0000);text-align:center;font-weight:900;text-transform:uppercase;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.35)}.dayblock{width:100%;box-sizing:border-box;border-radius:18px;color:#fff;padding:22px 32px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 12px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.30)}.dayblock::before{content:"";position:absolute;inset:-45% -25%;background:linear-gradient(110deg,rgba(255,255,255,.25),rgba(255,255,255,.10) 25%,transparent 55%);transform:rotate(-6deg)}.daytitle{position:relative;font-weight:900;font-size:28px;margin-bottom:12px;text-shadow:0 3px 6px rgba(0,0,0,.55)}.rows{position:relative;display:flex;flex-direction:column;gap:8px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;font-size:20px;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden}.event{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.time{flex:0 0 110px;min-width:110px;text-align:right;font-weight:900}.orange{background:linear-gradient(180deg,#c76512,#9f3f07)}.blue{background:linear-gradient(180deg,#1b5f9a,#0d3f72)}.green{background:linear-gradient(180deg,#2f7a36,#1f5f29)}.purple{background:linear-gradient(180deg,#5a2a7a,#3f1a5a)}@media(max-width:600px){body{padding:16px}.dayblock{padding:16px}.daytitle{font-size:22px}.row{font-size:16px}.time{flex-basis:80px;min-width:80px}}
</style></head><body><div class="wrap"><h1>Weekly Feed Admin</h1><p class="help">Sign in with your existing Staff Tools password, paste the weekly schedule, then re-enter your password to confirm saving.</p>
<div id="loginArea"><label for="loginPassword">Staff Tools Password</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" type="button">Enter Weekly Feed Admin</button></div>
<div id="editor" hidden><button id="logoutBtn" type="button">Sign out</button><label for="confirmPassword">Confirm Staff Password to Save</label><input id="confirmPassword" type="password" autocomplete="off"><label for="scheduleText">Weekly Schedule</label><textarea id="scheduleText" placeholder="Sunday, November 1&#10;9:15am Discipleship Classes&#10;9:30am Traditional Worship&#10;&#10;Monday, November 2&#10;6:00pm Trustees"></textarea><button id="saveBtn" type="button">Save Schedule</button><div id="saveResult" role="alert" aria-live="assertive" style="margin-top:14px;padding:14px;border-radius:10px;background:#243247;color:#fff;font-weight:700">No changes saved during this session.</div><div class="preview-title">Live Preview</div><div class="preview"><div class="preview-header">This Week at VUMC</div><div id="previewBlocks"></div></div></div>
<div id="status" class="status" role="status" aria-live="polite">Connecting to Staff Tools…</div></div>
<iframe id="staffBridge" title="Staff authentication" aria-hidden="true" tabindex="-1" src="https://script.google.com/macros/s/AKfycbzHpOIjWgX-jiOMGwiCBrONrmym-9kMJDOQ4DA15re8d-_MUidnpXbIGCZYTqM_gAJV/exec?bridge=1" style="position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none"></iframe>
<script>
(()=>{'use strict';const colors=['orange','blue','green','purple'];const $=id=>document.getElementById(id);let bridgeWindow=null,bridgeOrigin='',ready=false,token='',counter=0;const pending=new Map();const status=message=>$('status').textContent=message;
window.addEventListener('message',event=>{let u;try{u=new URL(event.origin)}catch{return}if(u.protocol!=='https:'||!(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.googleusercontent.com')))return;const d=event.data;if(!d||typeof d!=='object')return;if(d.type==='vumc-bridge-ready'){bridgeWindow=event.source;bridgeOrigin=event.origin;ready=true;status('Connected. Enter your Staff Tools password.');return}if(d.type!=='vumc-bridge-response'||event.source!==bridgeWindow||event.origin!==bridgeOrigin)return;const x=pending.get(d.requestId);if(!x)return;clearTimeout(x.timer);pending.delete(d.requestId);x.resolve(d.result||{success:false,error:'Empty response'})});
function request(action,payload={}){return new Promise((resolve,reject)=>{if(!ready||!bridgeWindow)return reject(new Error('Staff Tools authentication is not connected.'));const requestId='weekly-'+Date.now()+'-'+(++counter);const timer=setTimeout(()=>{pending.delete(requestId);reject(new Error('Request timed out'))},25000);pending.set(requestId,{resolve,reject,timer});bridgeWindow.postMessage({type:'vumc-bridge-request',requestId,action,payload},bridgeOrigin)})}
function check(r){if(!r||r.success!==true)throw new Error((r&&r.error)||'Request failed');return r}
function showEditor(){ $('loginArea').hidden=true;$('editor').hidden=false;status('Authorized. Re-enter your password when saving.');request('getWeeklySchedule',{token}).then(r=>{check(r);$('scheduleText').value=r.schedule||'';updatePreview()}).catch(e=>status('Could not load saved schedule: '+e.message))}
$('loginBtn').onclick=async()=>{const passkey=$('loginPassword').value;if(!passkey)return status('Enter your Staff Tools password.');$('loginBtn').disabled=true;try{const r=check(await request('staffLogin',{passkey}));token=r.token;$('loginPassword').value='';showEditor()}catch(e){status(e.message)}finally{$('loginBtn').disabled=false;$('loginPassword').value=''}};
$('logoutBtn').onclick=async()=>{const old=token;token='';$('editor').hidden=true;$('loginArea').hidden=false;$('confirmPassword').value='';status('Signed out.');try{if(old)await request('staffLogout',{token:old})}catch(_){}};
$('saveBtn').onclick=async()=>{const schedule=$('scheduleText').value.trim(),passkey=$('confirmPassword').value;const result=$('saveResult');const show=(message,ok)=>{result.textContent=message;result.style.background=ok?'#14532d':'#7f1d1d';status(message)};if(!schedule)return show('Please paste a schedule first.',false);if(!passkey)return show('Re-enter the Staff Tools password to confirm.',false);$('saveBtn').disabled=true;result.style.background='#243247';result.textContent='Saving schedule…';status('Saving schedule…');try{const r=check(await request('saveWeeklySchedule',{token,schedule,passkey}));result.textContent='Save returned successfully. Verifying stored schedule…';const verified=check(await request('getWeeklySchedule',{token}));if((verified.schedule||'').trim()!==schedule)throw new Error('The saved schedule did not match. Please retry.');show('SAVED AND VERIFIED — '+new Date(r.savedAt||Date.now()).toLocaleString()+'.',true)}catch(e){show('NOT CONFIRMED — '+e.message+'. Your text is still in the editor.',false)}finally{$('confirmPassword').value='';$('saveBtn').disabled=false}}
function escapeHTML(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function normalizeTime(s){return s.replace(/\s+/g,'').replace(/am/gi,'a').replace(/pm/gi,'p')}
function parseSchedule(raw){const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),days=[];let current=null;const day=/^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)\b/i,time=/^(\d{1,2}(?::\d{2})?\s*(?:am|pm|a|p)?(?:\s*[-–]\s*\d{1,2}(?::\d{2})?\s*(?:am|pm|a|p)?)?)\s+(.+)$/i;for(const line of lines){if(day.test(line)){current={title:line.replace(/\s+/g,' '),events:[]};days.push(current);continue}if(!current)continue;const m=line.match(time);current.events.push(m?{time:normalizeTime(m[1]),event:m[2].trim()}:{time:'',event:line})}return days}
function updatePreview(){const days=parseSchedule($('scheduleText').value);$('previewBlocks').innerHTML=days.length?days.map((day,i)=>'<div class="dayblock '+colors[i%colors.length]+'"><div class="daytitle">'+escapeHTML(day.title)+'</div><div class="rows">'+day.events.map(e=>'<div class="row"><span class="event">'+escapeHTML(e.event)+'</span><span class="time">'+escapeHTML(e.time)+'</span></div>').join('')+'</div></div>').join(''):'<div class="dayblock orange"><div class="daytitle">No Schedule Preview</div><div class="rows"><div class="row"><span class="event">Paste your schedule above.</span></div></div></div>'}
$('scheduleText').addEventListener('input',updatePreview);updatePreview();setTimeout(()=>{if(!ready)status('Could not connect to GAS. Check the deployed Bridge.html allowed origins.')},12000);
})();
</script></body></html>
