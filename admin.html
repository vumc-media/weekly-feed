<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weekly Feed Admin</title>
<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#101827;
  color:#fff;
  padding:30px;
}
.wrap{
  max-width:900px;
  margin:auto;
}
h1{margin-top:0;}
label{
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
}
textarea{
  min-height:420px;
  font-family:inherit;
  line-height:1.45;
}
button{
  margin-top:18px;
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  background:#42e8d5;
  color:#082222;
}
.status{
  margin-top:18px;
  font-weight:700;
}
.help{
  color:#cbd5e1;
  line-height:1.5;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weekly Feed Admin</h1>
  <p class="help">Paste the weekly schedule exactly like you normally send it. Then click Save Schedule.</p>

  <label>Admin Token</label>
  <input id="adminToken" type="password" placeholder="Enter admin token" />

  <label>Weekly Schedule</label>
  <textarea id="scheduleText" placeholder="Sunday April 19
9:15am Discipleship Classes
9:30am Traditional Worship

Monday, April 20
3:00pm Men's Jail Ministry"></textarea>

  <button onclick="saveSchedule()">Save Schedule</button>

  <div id="status" class="status"></div>
</div>

<script>
async function saveSchedule(){
  const token = document.getElementById("adminToken").value.trim();
  const rawSchedule = document.getElementById("scheduleText").value.trim();
  const status = document.getElementById("status");

  if(!token){
    status.textContent = "Please enter your admin token.";
    return;
  }

  if(!rawSchedule){
    status.textContent = "Please paste a schedule first.";
    return;
  }

  status.textContent = "Saving...";

  try{
    const res = await fetch("/.netlify/functions/save-schedule", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ token, rawSchedule })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || "Save failed.");
    }

    status.textContent = "Saved! Netlify will redeploy shortly. OBS will update after the deploy finishes.";
  }catch(err){
    status.textContent = "Error: " + err.message;
  }
}
</script>
</body>
</html>
